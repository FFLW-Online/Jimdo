media:
  input: assets/images
  output: assets/images

content:
  - name: startseite
    label: "Startseite"
    type: file
    path: index.html
    format: yaml-frontmatter
    fields:
      - name: title
        label: "Hauptüberschrift"
        type: string

      - name: intro
        label: "Einleitungstext"
        type: text

      - name: hero_image
        label: "Titelbild / Hauptbild"
        type: image

      - name: body
        label: "HTML-Inhalt der Seite"
        type: rich-text
        options:
          format: html
          switcher: true

  - name: test
    label: "Test"
    type: file
    path: test.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: "Titel"
        type: string

      - name: intro
        label: "Einleitung"
        type: text

      - name: body
        label: "Inhalt"
        type: rich-text
