<!DOCTYPE html>
<html lang="de" data-fflw-lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-sm-i18n="title">StromManager (v4) – Grunddaten</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="strommanager_v4.css" />
</head>
<body class="fflw-page strommanager-app" data-sm-version="v4">
  <header class="sm-header">
    <div>
      <h1 data-sm-i18n="title">StromManager <span class="sm-ver">(v4)</span></h1>
      <p class="sm-subtitle" data-sm-i18n="subtitle">Grunddaten für Person, Wohnung, Heizkörper &amp; Tarif</p>
    </div>
    <div class="sm-controls">
      <select id="sm-lang-select" aria-label="Sprache">
        <option value="de">DE</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
        <option value="uk">UK</option>
        <option value="tr">TR</option>
      </select>
      <button type="button" id="sm-tts-toggle" class="sm-btn sm-btn-secondary" aria-pressed="false">
        🔊 <span data-sm-i18n="ttsOff">Vorlesen: Aus</span>
      </button>
    </div>
  </header>

  <main class="sm-container">
    <form id="sm-grunddaten-form" novalidate>
      <section class="sm-card">
        <div class="sm-card-head">
          <h2 data-sm-i18n="secPerson">1. Person (zieht bei Umzug mit)</h2>
          <button type="button" class="sm-speak-btn" aria-label="Vorlesen">🔊</button>
        </div>
        <div class="sm-grid-2">
          <div class="sm-field">
            <label for="person-name" data-sm-i18n="personName">Name *</label>
            <input id="person-name" name="personName" type="text" required />
          </div>
          <div class="sm-field">
            <label for="person-id" data-sm-i18n="personId">Personen-ID</label>
            <input id="person-id" name="personId" type="text" placeholder="z. B. P-101" />
          </div>
          <div class="sm-field">
            <label for="autonomy-level" data-sm-i18n="autonomyLevel">Selbstständigkeit</label>
            <select id="autonomy-level" name="autonomyLevel">
              <option value="assisted" data-sm-i18n="autonomy1">1 – Mit Master-Hilfe</option>
              <option value="review" data-sm-i18n="autonomy2">2 – User füllt aus, Master prüft</option>
              <option value="independent" data-sm-i18n="autonomy3">3 – Selbstständig</option>
            </select>
          </div>
          <div class="sm-field">
            <label for="reminder-cycle" data-sm-i18n="reminderCycle">Erinnerungs-Turnus</label>
            <select id="reminder-cycle" name="reminderCycle">
              <option value="daily" data-sm-i18n="daily">Täglich</option>
              <option value="every_2_days" data-sm-i18n="every2Days">Alle 2 Tage</option>
              <option value="weekly" data-sm-i18n="weekly">Wöchentlich</option>
              <option value="custom" data-sm-i18n="custom">Frei</option>
            </select>
          </div>
          <div class="sm-field sm-span-2">
            <label for="person-photo" data-sm-i18n="personPhoto">Profilbild (optional)</label>
            <input id="person-photo" type="file" accept="image/*" />
            <div class="sm-preview" id="preview-person-photo"></div>
          </div>
        </div>
      </section>

      <section class="sm-card">
        <div class="sm-card-head">
          <h2 data-sm-i18n="secApartment">2. Wohnung &amp; Einzug</h2>
          <button type="button" class="sm-speak-btn" aria-label="Vorlesen">🔊</button>
        </div>
        <div class="sm-grid-3">
          <div class="sm-field">
            <label for="move-in-date" data-sm-i18n="moveInDate">Datum Einzug *</label>
            <input id="move-in-date" name="moveInDate" type="date" required />
          </div>
          <div class="sm-field">
            <label for="apartment-label" data-sm-i18n="apartmentLabel">Wohnungs-ID / Ort *</label>
            <input id="apartment-label" name="apartmentLabel" type="text" required />
          </div>
          <div class="sm-field">
            <label for="master-name" data-sm-i18n="masterName">Master / Begleitung</label>
            <input id="master-name" name="masterName" type="text" />
          </div>
          <div class="sm-field">
            <label for="room-count" data-sm-i18n="roomCount">Zimmer</label>
            <input id="room-count" name="roomCount" type="number" min="1" max="30" value="2" />
          </div>
          <div class="sm-field">
            <label for="heater-count" data-sm-i18n="heaterCount">Heizkörper / Nachtspeicher</label>
            <input id="heater-count" name="heaterCount" type="number" min="0" max="40" value="2" />
          </div>
          <div class="sm-field">
            <label for="thermostat-count" data-sm-i18n="thermostatCount">Thermostate</label>
            <input id="thermostat-count" name="thermostatCount" type="number" min="0" max="40" value="2" />
          </div>
          <div class="sm-field sm-span-3">
            <label for="floorplan-photo" data-sm-i18n="floorplanPhoto">Foto Grundriss (optional)</label>
            <input id="floorplan-photo" type="file" accept="image/*" />
            <div class="sm-preview" id="preview-floorplan-photo"></div>
          </div>
        </div>

        <div class="sm-subbox">
          <div class="sm-subbox-head">
            <h3 data-sm-i18n="secLabels">Aufkleber (HK-1, TH-1)</h3>
            <button type="button" id="sm-generate-labels" class="sm-btn sm-btn-secondary" data-sm-i18n="genLabels">
              Aufkleber erzeugen
            </button>
          </div>
          <p class="sm-hint" data-sm-i18n="labelHint">Aufkleber an Heizkörper &amp; Thermostat anbringen und Raum zuordnen.</p>
          <div id="sm-labels-list"></div>
        </div>
      </section>

      <section class="sm-card">
        <div class="sm-card-head">
          <h2 data-sm-i18n="secTariff">3. Tarif, Vertrag &amp; Endkontrolle</h2>
          <button type="button" class="sm-speak-btn" aria-label="Vorlesen">🔊</button>
        </div>
        <div class="sm-grid-2">
          <div class="sm-field">
            <label for="tariff-valid-from" data-sm-i18n="validFrom">Tarif gültig ab</label>
            <input id="tariff-valid-from" name="tariffValidFrom" type="date" />
          </div>
          <div class="sm-field">
            <label for="provider-name" data-sm-i18n="provider">Anbieter</label>
            <input id="provider-name" name="providerName" type="text" />
          </div>
          <div class="sm-field sm-span-2">
            <label for="contract-photo" data-sm-i18n="contractPhoto">Foto Vertrag (für KI-Auslesung)</label>
            <div class="sm-upload-row">
              <input id="contract-photo" type="file" accept="image/*" />
              <button type="button" id="sm-ai-read-contract" class="sm-btn sm-btn-secondary" data-sm-i18n="aiRead">
                ✨ Vertrag auslesen
              </button>
            </div>
            <div class="sm-preview" id="preview-contract-photo"></div>
            <div id="sm-ai-status" class="sm-status"></div>
          </div>
          <div class="sm-field">
            <label for="price-household" data-sm-i18n="priceHH">Haushalt (ct/kWh)</label>
            <input id="price-household" type="number" step="0.01" />
          </div>
          <div class="sm-field">
            <label for="base-price-month" data-sm-i18n="basePrice">Grundpreis (€/Monat)</label>
            <input id="base-price-month" type="number" step="0.01" />
          </div>
          <div class="sm-field">
            <label for="price-nt" data-sm-i18n="priceNT">Heizstrom NT (ct/kWh)</label>
            <input id="price-nt" type="number" step="0.01" />
          </div>
          <div class="sm-field">
            <label for="price-ht" data-sm-i18n="priceHT">Heizstrom HT (ct/kWh)</label>
            <input id="price-ht" type="number" step="0.01" />
          </div>
        </div>

        <div class="sm-subbox">
          <label class="sm-checkbox-label">
            <input id="final-check-done" type="checkbox" />
            <span data-sm-i18n="finalCheck">Endkontrolle durchgeführt (User oder Master)</span>
          </label>
          <div class="sm-field" style="margin-top: 0.6rem;">
            <label for="checked-by" data-sm-i18n="checkedBy">Geprüft von</label>
            <input id="checked-by" type="text" placeholder="User / Master" />
          </div>
        </div>
      </section>

      <div class="sm-actions">
        <button type="submit" class="sm-btn sm-btn-primary" data-sm-i18n="save">Speichern</button>
        <div id="sm-submit-feedback" class="sm-status"></div>
      </div>
    </form>
  </main>

  <script src="i18n_v4.js"></script>
  <script src="strommanager_v4.js"></script>
</body>
</html>
