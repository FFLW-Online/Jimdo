<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktuelle Angebote – FFLW Warenhaus</title>
  <style>
    :root {
      --bg: #f5f7f9;
      --card: #ffffff;
      --ink: #18222f;
      --muted: #5c6b7c;
      --brand: #1b4f72;
      --brand-2: #117a65;
      --warn: #b7791f;
      --danger: #9b2c2c;
      --line: #dde4ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      padding: 20px 24px;
    }
    header h1 { margin: 0 0 6px; font-size: 1.45rem; }
    header p { margin: 0; opacity: 0.92; font-size: 0.94rem; }
    .wrap { max-width: 1180px; margin: 18px auto 60px; padding: 0 16px; }
    .toolbar {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .toolbar-left, .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, textarea {
      padding: 8px 10px;
      border: 1px solid #c6d1dc;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fff;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
    }
    button:hover { opacity: 0.92; }
    button.secondary { background: #e9eff4; color: var(--ink); }
    button.success { background: var(--brand-2); color: #fff; }
    button.warn { background: var(--warn); color: #fff; }
    button.danger { background: var(--danger); color: #fff; }
    .admin-bar {
      display: none;
      background: #fffbeb;
      border: 1px solid #f6e05e;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .admin-bar.active { display: flex; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .img-stage {
      position: relative;
      height: 165px;
      background: #eef2f6;
      overflow: hidden;
      cursor: zoom-in;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }
    .mini-thumbs {
      display: flex;
      gap: 6px;
      padding: 8px 12px 0;
      flex-wrap: wrap;
    }
    .mini-thumb {
      width: 42px;
      height: 34px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .card-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .badge {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e9f2f9;
      color: var(--brand);
    }
    .badge.res { background: #fde8e8; color: var(--danger); }
    .badge.dup { background: #fef3c7; color: #92400e; }
    .badge.dir { background: #d1fae5; color: #065f46; }
    .title { margin: 0 0 6px; font-size: 1.05rem; }
    .meta { font-size: 0.84rem; color: var(--muted); margin-bottom: 8px; }
    .desc { font-size: 0.88rem; margin: 0 0 10px; flex: 1; }
    .direct-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      margin-bottom: 10px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .admin-actions {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      flex-wrap: wrap;
      gap: 5px;
    }
    body.is-admin .admin-actions { display: flex; }
    .admin-actions button { padding: 5px 8px; font-size: 0.76rem; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      max-width: 540px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 20px;
    }
    .modal-box img.zoom-img {
      max-width: 100%;
      max-height: 65vh;
      display: block;
      margin: 0 auto 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aktuelle Angebote – FFLW Warenhaus</h1>
    <p>Schnelle Übersicht mit Vergrößerungs-Zoom und Anfrage über das Warenhaus (oder direkt bei freigegebenen Anbietern)</p>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="search" id="searchInput" placeholder="Artikel oder Ort suchen..." />
        <select id="categoryFilter">
          <option value="">Alle Kategorien</option>
        </select>
        <label style="font-size:0.86rem; display:flex; align-items:center; gap:5px; cursor:pointer;">
          <input type="checkbox" id="onlyDuplicatesFilter" /> Nur mögliche Dubletten / Serien
        </label>
      </div>
      <div class="toolbar-right">
        <input type="password" id="staffCodeInput" placeholder="Team-/Master-Code" style="width:150px;" />
        <button type="button" id="btnStaffLogin" class="secondary">Team-Login</button>
        <button type="button" id="btnStaffLogout" class="secondary" style="display:none;">Logout</button>
      </div>
    </div>

    <div id="adminBar" class="admin-bar">
      <div>
        <strong>Team- / Supermaster-Modus aktiv:</strong>
        <span id="selectedCountLabel">0 ausgewählt</span>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button type="button" id="btnSelectDuplicates" class="warn">Dubletten markieren</button>
        <button type="button" id="btnDeleteSelected" class="danger">Markierte löschen</button>
        <button type="button" id="btnClearSelection" class="secondary">Auswahl aufheben</button>
      </div>
    </div>

    <div id="offersGrid" class="grid"><p>Lade Angebote...</p></div>
  </div>

  <!-- Reservierungs-Modal -->
  <div id="reserveModal" class="modal-backdrop">
    <div class="modal-box">
      <h3 id="reserveTitle" style="margin-top:0;">Anfrage senden</h3>
      <p id="reserveInfo" style="font-size:0.88rem; color:var(--muted);"></p>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-size:0.85rem; font-weight:600;">Dein Name</label>
        <input type="text" id="resName" style="width:100%;" placeholder="Vor- und Nachname" />
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-size:0.85rem; font-weight:600;">Telefon oder E-Mail</label>
        <input type="text" id="resContact" style="width:100%;" placeholder="Telefonnummer oder E-Mail" />
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-size:0.85rem; font-weight:600;">Nachricht / Abholwunsch</label>
        <textarea id="resNote" style="width:100%;" placeholder="z. B. Wann passt eine Abholung?"></textarea>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="secondary" onclick="closeModal('reserveModal')">Abbrechen</button>
        <button type="button" class="success" id="btnConfirmReserve">Anfrage absenden</button>
      </div>
    </div>
  </div>

  <!-- Bild-Zoom-Modal -->
  <div id="zoomModal" class="modal-backdrop" onclick="if(event.target===this) closeModal('zoomModal')">
    <div class="modal-box" style="max-width:760px;">
      <img id="zoomImg" class="zoom-img" src="" alt="Großansicht" />
      <div id="zoomCaption" style="font-size:0.9rem; margin-bottom:10px;"></div>
      <div style="text-align:right;">
        <button type="button" class="secondary" onclick="closeModal('zoomModal')">Schließen</button>
      </div>
    </div>
  </div>

  <!-- Rückfrage an Anbieter Modal -->
  <div id="inquiryModal" class="modal-backdrop" onclick="if(event.target===this) closeModal('inquiryModal')">
    <div class="modal-box">
      <h3 style="margin-top:0;">Rückfrage an Anbieter</h3>
      <div id="inquiryDetails" style="font-size:0.9rem; margin-bottom:12px;"></div>
      <div style="text-align:right;">
        <button type="button" class="secondary" onclick="closeModal('inquiryModal')">Schließen</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = window.FFLW_GAS_URL || localStorage.getItem("FFLW_GAS_URL") || "";
    let allItems = [];
    let staffCode = sessionStorage.getItem("FFLW_STAFF_CODE") || "";
    let staffRole = sessionStorage.getItem("FFLW_STAFF_ROLE") || "";
    let selectedIds = new Set();
    let activeReserveItem = null;

    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }

    async function callGasGet(params) {
      if (!GAS_URL) return { ok: false, items: [] };
      const qs = new URLSearchParams(params).toString();
      const r = await fetch(GAS_URL + "?" + qs);
      return r.json();
    }

    async function callGasPost(bodyObj) {
      if (!GAS_URL) throw new Error("Keine GAS-URL konfiguriert.");
      const r = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(bodyObj)
      });
      return r.json();
    }

    function applyStaffUi() {
      const isStaff = Boolean(staffCode && staffRole);
      document.body.classList.toggle("is-admin", isStaff);
      document.getElementById("adminBar").classList.toggle("active", isStaff);
      document.getElementById("btnStaffLogout").style.display = isStaff ? "inline-block" : "none";
      updateSelectionLabel();
    }

    function updateSelectionLabel() {
      document.getElementById("selectedCountLabel").textContent = selectedIds.size + " ausgewählt";
    }

    function computeDuplicateMap(items) {
      const counts = {};
      items.forEach((it) => {
        const key = (String(it.titel || "").toLowerCase().replace(/[^a-z0-9äöü]/g, "").slice(0, 24)) + "|" + String(it.anbieterLabel || "").toLowerCase().trim();
        counts[key] = (counts[key] || 0) + 1;
      });
      const dupSet = new Set();
      items.forEach((it) => {
        const key = (String(it.titel || "").toLowerCase().replace(/[^a-z0-9äöü]/g, "").slice(0, 24)) + "|" + String(it.anbieterLabel || "").toLowerCase().trim();
        if (counts[key] > 1) dupSet.add(it.id);
      });
      return dupSet;
    }

    function renderOffers() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const onlyDups = document.getElementById("onlyDuplicatesFilter").checked;
      const dupSet = computeDuplicateMap(allItems);

      const filtered = allItems.filter((it) => {
        if (cat && (it.kategorie || it.raum) !== cat) return false;
        if (onlyDups && !dupSet.has(it.id)) return false;
        if (q) {
          const hay = [it.titel, it.beschreibung, it.ort, it.kategorie, it.anbieterLabel].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const grid = document.getElementById("offersGrid");
      if (!filtered.length) {
        grid.innerHTML = "<p>Keine passenden Angebote gefunden.</p>";
        return;
      }

      grid.innerHTML = filtered.map((it) => {
        const isDup = dupSet.has(it.id);
        const imgs = Array.isArray(it.bilder) && it.bilder.length ? it.bilder : [];
        const mainImg = imgs[0] || { thumbUrl: it.bildUrl || "", fullUrl: it.vollBildUrl || it.bildUrl || "", rotation: it.rotation || 0 };
        const extraThumbs = imgs.length > 1
          ? `<div class="mini-thumbs">${imgs.map((b, idx) => `<img class="mini-thumb" src="${b.thumbUrl}" style="transform:rotate(${b.rotation || 0}deg);" onclick="switchCardPhoto('${it.id}', ${idx})" alt="Bild ${idx + 1}" />`).join("")}</div>`
          : "";

        const directHtml = (it.direktKontaktFreigegeben && it.anbieterKontakt && (it.anbieterKontakt.telefon || it.anbieterKontakt.email))
          ? `<div class="direct-box"><strong>Direktkontakt freigegeben:</strong> ${[it.anbieterKontakt.telefon, it.anbieterKontakt.email].filter(Boolean).join(" · ")}</div>`
          : "";

        return `
          <article class="card" id="card_${it.id}">
            <div class="img-stage" onclick="openZoom('${mainImg.fullUrl || mainImg.thumbUrl}', '${(it.titel || "").replace(/'/g, "\'")}', ${mainImg.rotation || 0})">
              ${mainImg.thumbUrl ? `<img id="main_img_${it.id}" src="${mainImg.thumbUrl}" loading="lazy" alt="${it.titel}" style="transform:rotate(${mainImg.rotation || 0}deg);" />` : `<span style="color:var(--muted); font-size:0.85rem;">Kein Foto</span>`}
            </div>
            ${extraThumbs}
            <div class="card-body">
              <div class="badges">
                <span class="badge">${it.kategorie || "Sonstiges"}</span>
                ${it.reserviert ? `<span class="badge res">Reserviert</span>` : `<span class="badge">Verfügbar</span>`}
                ${it.direktKontaktFreigegeben ? `<span class="badge dir">Direktkontakt</span>` : ``}
                ${isDup ? `<span class="badge dup">Mögliche Dublette</span>` : ``}
              </div>
              <h3 class="title">${it.titel}</h3>
              <div class="meta">${it.ort || "Leutenbach / Winnenden"}${it.masse ? " · " + it.masse : ""}</div>
              <p class="desc">${it.beschreibung || ""}</p>
              ${directHtml}
              <div class="actions">
                <button type="button" class="success" ${it.reserviert ? "disabled" : ""} onclick="openReserve('${it.id}')">${it.reserviert ? "Bereits reserviert" : "Anfragen / Reservieren"}</button>
              </div>
              <div class="admin-actions">
                <label style="font-size:0.75rem; display:flex; align-items:center; gap:3px; cursor:pointer;">
                  <input type="checkbox" ${selectedIds.has(it.id) ? "checked" : ""} onchange="toggleSelectId('${it.id}', this.checked)" /> Auswahl
                </label>
                <button type="button" class="secondary" onclick="rotateCard('${it.id}')">&#8635; Drehen</button>
                <button type="button" class="secondary" onclick="toggleDirect('${it.id}', ${!it.direktKontaktFreigegeben})">${it.direktKontaktFreigegeben ? "Direktkontakt sperren" : "Direktkontakt frei"}</button>
                <button type="button" class="secondary" onclick="openInquiry('${it.id}')">Rückfrage</button>
                <button type="button" class="warn" onclick="archiveCard('${it.id}')">Ruhestand</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function switchCardPhoto(itemId, idx) {
      const it = allItems.find((x) => x.id === itemId);
      if (!it || !it.bilder || !it.bilder[idx]) return;
      const b = it.bilder[idx];
      const imgEl = document.getElementById("main_img_" + itemId);
      if (imgEl) {
        imgEl.src = b.thumbUrl;
        imgEl.style.transform = `rotate(${b.rotation || 0}deg)`;
      }
    }

    function openZoom(url, title, rot) {
      if (!url) return;
      const zImg = document.getElementById("zoomImg");
      zImg.src = url;
      zImg.style.transform = `rotate(${rot || 0}deg)`;
      document.getElementById("zoomCaption").textContent = title || "";
      openModal("zoomModal");
    }

    function openReserve(itemId) {
      const it = allItems.find((x) => x.id === itemId);
      if (!it || it.reserviert) return;
      activeReserveItem = it;
      document.getElementById("reserveTitle").textContent = "Anfrage: " + it.titel;
      document.getElementById("reserveInfo").textContent = it.direktKontaktFreigegeben
        ? "Anfrage wird über das Warenhaus erfasst; Direktkontakt zum Anbieter ist für diesen Artikel freigegeben."
        : "Anfrage läuft zuerst über unser Warenhaus / Koordinationsteam.";
      openModal("reserveModal");
    }

    document.getElementById("btnConfirmReserve").addEventListener("click", async () => {
      if (!activeReserveItem) return;
      const name = document.getElementById("resName").value.trim();
      const contact = document.getElementById("resContact").value.trim();
      const note = document.getElementById("resNote").value.trim();
      if (!name || !contact) return alert("Bitte Name und Kontakt (Telefon oder E-Mail) angeben.");
      try {
        const res = await callGasPost({
          action: "reserveItem",
          folderId: activeReserveItem.id,
          name: name,
          kontakt: contact,
          nachricht: note
        });
        if (!res.ok) return alert(res.error || "Reservierung fehlgeschlagen.");
        closeModal("reserveModal");
        document.getElementById("resName").value = "";
        document.getElementById("resContact").value = "";
        document.getElementById("resNote").value = "";
        await loadOffers();
      } catch (err) {
        alert("Fehler: " + err.message);
      }
    });

    function toggleSelectId(id, checked) {
      if (checked) selectedIds.add(id);
      else selectedIds.delete(id);
      updateSelectionLabel();
    }

    document.getElementById("btnSelectDuplicates").addEventListener("click", () => {
      const dupSet = computeDuplicateMap(allItems);
      dupSet.forEach((id) => selectedIds.add(id));
      updateSelectionLabel();
      renderOffers();
    });

    document.getElementById("btnClearSelection").addEventListener("click", () => {
      selectedIds.clear();
      updateSelectionLabel();
      renderOffers();
    });

    document.getElementById("btnDeleteSelected").addEventListener("click", async () => {
      if (!selectedIds.size) return alert("Keine Artikel markiert.");
      if (!confirm(selectedIds.size + " markierte Artikel wirklich in den Papierkorb verschieben?")) return;
      try {
        const res = await callGasPost({
          action: "bulkDeleteOffers",
          masterCode: staffCode,
          folderIds: Array.from(selectedIds)
        });
        if (!res.ok) return alert(res.error || "Löschen fehlgeschlagen.");
        selectedIds.clear();
        await loadOffers();
      } catch (err) {
        alert("Fehler: " + err.message);
      }
    });

    async function rotateCard(itemId) {
      const it = allItems.find((x) => x.id === itemId);
      const imgId = (it && it.bilder && it.bilder[0]) ? it.bilder[0].id : "";
      try {
        const res = await callGasPost({
          action: "rotateOfferImage",
          masterCode: staffCode,
          folderId: itemId,
          imageId: imgId,
          deltaDeg: 90
        });
        if (!res.ok) return alert(res.error || "Drehen fehlgeschlagen.");
        await loadOffers();
      } catch (err) {
        alert("Fehler: " + err.message);
      }
    }

    async function toggleDirect(itemId, allowed) {
      try {
        const res = await callGasPost({
          action: "toggleDirectContact",
          masterCode: staffCode,
          folderId: itemId,
          allowed: allowed
        });
        if (!res.ok) return alert(res.error || "Änderung fehlgeschlagen.");
        await loadOffers();
      } catch (err) {
        alert("Fehler: " + err.message);
      }
    }

    async function archiveCard(itemId) {
      if (!confirm("Artikel in Ruhestand / Archiv verschieben?")) return;
      try {
        const res = await callGasPost({
          action: "archiveOfferItem",
          masterCode: staffCode,
          folderId: itemId
        });
        if (!res.ok) return alert(res.error || "Archivieren fehlgeschlagen.");
        await loadOffers();
      } catch (err) {
        alert("Fehler: " + err.message);
      }
    }

    function openInquiry(itemId) {
      const it = allItems.find((x) => x.id === itemId);
      if (!it) return;
      document.getElementById("inquiryDetails").innerHTML = `
        <p><strong>Artikel:</strong> ${it.titel}</p>
        <p><strong>Anbieter:</strong> ${it.anbieterLabel || "-"}</p>
        <p><strong>Direktkontakt für Suchende freigegeben:</strong> ${it.direktKontaktFreigegeben ? "Ja" : "Nein (läuft über Warenhaus)"}</p>
        <p style="color:var(--muted); font-size:0.84rem;">Tipp: Für Rückfragen an den Anbieter die Kontaktdaten aus der Spender-/Eingangsakte verwenden und nach Rücksprache ggf. den Direktkontakt freischalten.</p>
      `;
      openModal("inquiryModal");
    }

    document.getElementById("btnStaffLogin").addEventListener("click", async () => {
      const code = document.getElementById("staffCodeInput").value.trim();
      if (!code) return;
      try {
        const res = await callGasGet({ action: "verify_master_code", code: code });
        if (!res.ok) return alert(res.error || "Code ungültig.");
        staffCode = code;
        staffRole = res.role;
        sessionStorage.setItem("FFLW_STAFF_CODE", staffCode);
        sessionStorage.setItem("FFLW_STAFF_ROLE", staffRole);
        applyStaffUi();
        renderOffers();
      } catch (err) {
        alert("Fehler: " + err.message);
      }
    });

    document.getElementById("btnStaffLogout").addEventListener("click", () => {
      staffCode = "";
      staffRole = "";
      selectedIds.clear();
      sessionStorage.removeItem("FFLW_STAFF_CODE");
      sessionStorage.removeItem("FFLW_STAFF_ROLE");
      applyStaffUi();
      renderOffers();
    });

    function populateCategories() {
      const sel = document.getElementById("categoryFilter");
      const cats = Array.from(new Set(allItems.map((i) => i.kategorie || i.raum || "Sonstiges"))).sort();
      sel.innerHTML = '<option value="">Alle Kategorien</option>' + cats.map((c) => `<option value="${c}">${c}</option>`).join("");
    }

    async function loadOffers() {
      try {
        const res = await callGasGet({ vorschau: staffCode || "" });
        allItems = Array.isArray(res.items) ? res.items : [];
        populateCategories();
        renderOffers();
      } catch (err) {
        document.getElementById("offersGrid").innerHTML = "<p>Fehler beim Laden der Angebote: " + err.message + "</p>";
      }
    }

    document.getElementById("searchInput").addEventListener("input", renderOffers);
    document.getElementById("categoryFilter").addEventListener("change", renderOffers);
    document.getElementById("onlyDuplicatesFilter").addEventListener("change", renderOffers);

    applyStaffUi();
    loadOffers();
  </script>
