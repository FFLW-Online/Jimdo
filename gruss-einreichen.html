<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Videogruß einreichen – Freundeskreis Leutenbach-Winnenden</title>
  <style>
    :root {
      --fflw-teal: #00796b;
      --fflw-teal-dark: #004d40;
      --fflw-teal-mid: #26a69a;
      --fflw-teal-soft: #e0f2f1;
      --fflw-mint-bg: #f1f8f6;
      --jugendstil-gold: #c8963e;
      --card: #ffffff;
      --text: #1b332f;
      --muted: #4b6863;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--fflw-mint-bg);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(38, 166, 154, 0.11) 0%, transparent 32%),
        radial-gradient(circle at 88% 82%, rgba(0, 121, 107, 0.11) 0%, transparent 36%);
      color: var(--text);
      line-height: 1.55;
    }

    .art-nouveau-page {
      max-width: 680px;
      margin: 22px auto 48px;
      padding: 12px;
    }

    .art-nouveau-frame {
      position: relative;
      background: var(--card);
      border: 3px solid var(--fflw-teal);
      border-radius: 26px 6px 26px 6px;
      padding: 32px 24px 38px;
      box-shadow:
        0 0 0 6px var(--fflw-teal-soft),
        0 0 0 8px var(--jugendstil-gold),
        0 14px 36px rgba(0, 77, 64, 0.15);
    }

    .fflw-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-medallion {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #ffffff, var(--fflw-teal-soft));
      border: 2px solid var(--fflw-teal);
      box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--jugendstil-gold);
      border-radius: 44px 12px 44px 12px;
      padding: 12px 24px;
      margin-bottom: 10px;
    }

    .logo-medallion img {
      max-height: 70px;
      width: auto;
    }

    .brand-title {
      font-family: Georgia, serif;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--fflw-teal-dark);
    }

    .floral-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px auto 20px;
      max-width: 380px;
    }
    .floral-divider span.line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--fflw-teal), var(--jugendstil-gold), var(--fflw-teal), transparent);
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      margin-top: 0;
      font-size: 1.55rem;
      color: var(--fflw-teal-dark);
      text-align: center;
    }

    .intro {
      text-align: center;
      color: var(--muted);
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--fflw-teal-dark);
      margin: 16px 0 6px;
    }

    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--fflw-teal-mid);
      border-radius: 12px 4px 12px 4px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
    }

    textarea { min-height: 95px; resize: vertical; }

    .hint {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .duration-warn {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      background: #ffe8e8;
      border: 1.5px solid #e06c6c;
      border-radius: 12px;
      color: #8a1f1f;
      font-size: 0.94rem;
      font-weight: 500;
      line-height: 1.5;
    }

    button#submitBtn {
      margin-top: 24px;
      width: 100%;
      padding: 15px 18px;
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--fflw-teal), var(--fflw-teal-dark));
      border: 2px solid var(--jugendstil-gold);
      border-radius: 16px 4px 16px 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button#submitBtn:disabled {
      background: linear-gradient(135deg, #5c7d78, #44615d);
      cursor: wait;
    }

    .hourglass-spin {
      display: inline-block;
      font-size: 1.25rem;
      animation: flipHourglass 1.6s infinite ease-in-out;
    }

    @keyframes flipHourglass {
      0% { transform: rotate(0deg); }
      45% { transform: rotate(180deg); }
      55% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-bar-wrap {
      display: none;
      width: 100%;
      height: 14px;
      background: var(--fflw-teal-soft);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid var(--fflw-teal-mid);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--fflw-teal), var(--jugendstil-gold));
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    .status {
      margin-top: 16px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 500;
      line-height: 1.5;
    }
    .status.ok { display: block; background: var(--fflw-teal-soft); color: var(--fflw-teal-dark); border: 1.5px solid var(--fflw-teal); }
    .status.err { display: block; background: #ffe3e3; color: #8a1f1f; border: 1.5px solid #f8b4b4; }
    .status.wait { display: block; background: #fdf8ee; color: #7c5818; border: 1.5px solid var(--jugendstil-gold); }
  </style>
</head>
<body>

<div class="art-nouveau-page">
  <div class="art-nouveau-frame">

    <header class="fflw-header">
      <div class="logo-medallion" id="logoWrapper">
        <img id="fflwLogo" src="images/logo.png" alt="Freundeskreis Leutenbach-Winnenden">
      </div>
      <div class="brand-title">Freundeskreis Asyl Leutenbach · Winnenden</div>
      <div class="floral-divider">
        <span class="line"></span>
        <span style="color:#c8963e; font-size:1.2rem;">❦ ✿ ❦</span>
        <span class="line"></span>
      </div>
    </header>

    <h1>🎬 Videogruß für Birgid einreichen</h1>
    <p class="intro">Bitte verrate es nicht weiter – wir sammeln persönliche Videogrüße und liebe Worte zum Abschied.</p>

    <form id="uploadForm">
      <label for="absender">Dein Name / Eure Familie *</label>
      <input type="text" id="absender" required placeholder="z. B. Familie Al-Mansoor oder Maria & Peter">

      <label for="videoDatei">Videogruß (oder Foto) auswählen *</label>
      <input type="file" id="videoDatei" accept="video/*,image/*" required>
      <div class="hint">Tipp: Handy bitte quer halten – <strong>maximal 2 Minuten</strong> aufnehmen.</div>
      <div id="durationWarn" class="duration-warn"></div>

      <label for="nachricht">Kurzer schriftlicher Gruß dazu (optional)</label>
      <textarea id="nachricht" placeholder="Danke für deine Hilfe und alles Gute bei deinen Kindern!"></textarea>

      <button type="submit" id="submitBtn">
        <span id="btnIcon">📤</span>
        <span id="btnText">Videogruß jetzt absenden</span>
      </button>

      <div id="progressWrap" class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
    </form>

    <div id="statusBox" class="status"></div>

  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2PjaMEug9ZDqMS3Sd1YDf0ptCgr5ytt2EeWfmjrFqYKabVXfhHyI-v-wotjE9sTJycA/exec";
  const MAX_SEKUNDEN = 123; // 2 Minuten (inkl. 3 Sek. Toleranz)
  const MAX_MB = 250;

  let videoZuLang = false;

  (function loadFflwLogo() {
    const img = document.getElementById("fflwLogo");
    const candidates = [
      "images/logo.png", "img/logo.png", "logo.png",
      "images/fflw-logo.png", "img/fflw-logo.png",
      "images/logo.jpg", "logo.jpg", "images/logo.svg"
    ];
    let idx = 0;
    img.onerror = function() {
      idx++;
      if (idx < candidates.length) {
        img.src = candidates[idx];
      } else {
        document.getElementById("logoWrapper").style.display = "none";
      }
    };
  })();

  // Videodauer sofort nach Auswahl prüfen
  document.getElementById("videoDatei").addEventListener("change", function() {
    const warnBox = document.getElementById("durationWarn");
    warnBox.style.display = "none";
    videoZuLang = false;

    const file = this.files[0];
    if (!file) return;

    const sizeMB = file.size / (1024 * 1024);
    if (sizeMB > MAX_MB) {
      videoZuLang = true;
      warnBox.style.display = "block";
      warnBox.innerHTML = "⚠️ <strong>Diese Datei ist leider zu groß (" + Math.round(sizeMB) + " MB).</strong> Bitte nimm das Video etwas kürzer auf (maximal 2 Minuten).";
      return;
    }

    if (file.type.startsWith("video/")) {
      const tempVideo = document.createElement("video");
      tempVideo.preload = "metadata";
      tempVideo.onloadedmetadata = function() {
        window.URL.revokeObjectURL(tempVideo.src);
        if (tempVideo.duration > MAX_SEKUNDEN) {
          videoZuLang = true;
          const min = Math.floor(tempVideo.duration / 60);
          const sec = Math.round(tempVideo.duration % 60);
          warnBox.style.display = "block";
          warnBox.innerHTML = "⚠️ <strong>Dein Video ist " + min + ":" + (sec < 10 ? "0" : "") + sec + " Minuten lang.</strong><br>Damit alle Grüße gut Platz haben, sind <strong>maximal 2 Minuten</strong> erlaubt. Bitte kürze das Video auf deinem Handy oder nimm es kurz neu auf!";
        }
      };
      tempVideo.src = URL.createObjectURL(file);
    }
  });

  document.getElementById("uploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const btnIcon = document.getElementById("btnIcon");
    const btnText = document.getElementById("btnText");
    const progressWrap = document.getElementById("progressWrap");
    const progressFill = document.getElementById("progressFill");
    const statusBox = document.getElementById("statusBox");
    const file = document.getElementById("videoDatei").files[0];

    if (!file) return;

    if (videoZuLang) {
      statusBox.className = "status err";
      statusBox.innerHTML = "Bitte kürze dein Video zuerst auf <strong>maximal 2 Minuten</strong> und wähle es dann neu aus.";
      return;
    }

    btn.disabled = true;
    btnIcon.className = "hourglass-spin";
    btnIcon.textContent = "⏳";
    btnText.textContent = "Upload wird vorbereitet...";
    progressWrap.style.display = "block";
    progressFill.style.width = "5%";

    statusBox.className = "status wait";
    statusBox.innerHTML = "<strong>⏳ Dein Videogruß wird übertragen...</strong><br>Bitte diese Seite geöffnet lassen und das Handy kurz nicht sperren.";

    try {
      // Schritt 1: Upload-Session über Apps Script anfordern (nur Metadaten, winzig & blitzschnell)
      const initRes = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          absender: document.getElementById("absender").value,
          nachricht: document.getElementById("nachricht").value,
          fileName: file.name,
          mimeType: file.type
        })
      });
      const initData = await initRes.json();
      if (!initData.ok || !initData.uploadUrl) {
        throw new Error(initData.error || "Upload konnte nicht gestartet werden.");
      }

      // Schritt 2: Video direkt mit echtem Prozentbalken in Google Drive hochladen
      await uploadDirectToDrive(initData.uploadUrl, file, function(percent) {
        progressFill.style.width = percent + "%";
        btnText.textContent = "Wird hochgeladen (" + percent + "%)...";
      });

      statusBox.className = "status ok";
      statusBox.innerHTML = "✅ <strong>Herzlichen Dank!</strong> Dein Videogruß ist vollständig angekommen und erscheint sofort auf der Überraschungsseite.";
      document.getElementById("uploadForm").reset();
      document.getElementById("durationWarn").style.display = "none";
    } catch (err) {
      statusBox.className = "status err";
      statusBox.textContent = "Fehler beim Hochladen: " + err.message;
    } finally {
      btn.disabled = false;
      btnIcon.className = "";
      btnIcon.textContent = "📤";
      btnText.textContent = "Videogruß jetzt absenden";
      progressWrap.style.display = "none";
    }
  });

  function uploadDirectToDrive(uploadUrl, file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl, true);
      xhr.setRequestHeader("Content-Type", file.type || "video/mp4");

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const pct = Math.max(5, Math.min(99, Math.round((e.loaded / e.total) * 100)));
          onProgress(pct);
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200 || xhr.status === 201) {
          onProgress(100);
          resolve();
        } else {
          reject(new Error("Google Drive Antwort: " + xhr.status));
        }
      };

      xhr.onerror = function() {
        reject(new Error("Netzwerkverbindung unterbrochen – bitte erneut versuchen."));
      };

      xhr.send(file);
    });
  }
</script>

</body>
</html>
