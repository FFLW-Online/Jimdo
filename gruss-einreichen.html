<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Videogruß einreichen – Freundeskreis Leutenbach-Winnenden</title>
  <style>
    :root {
      --fflw-teal: #00796b;
      --fflw-teal-dark: #004d40;
      --fflw-teal-mid: #26a69a;
      --fflw-teal-soft: #e0f2f1;
      --fflw-bg: #f2f8f7;
      --fflw-warm: #e08a3c;
      --jugendstil-gold: #c8963e;
      --jugendstil-gold-light: #e5be73;
      --card: #ffffff;
      --text: #1b332f;
      --muted: #4b6863;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--fflw-bg);
      background-image:
        radial-gradient(circle at 12% 14%, rgba(38, 166, 154, 0.14) 0%, transparent 36%),
        radial-gradient(circle at 88% 84%, rgba(0, 121, 107, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 84% 12%, rgba(200, 150, 62, 0.11) 0%, transparent 32%);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 68px 14px 44px;
    }

    /* Hauptkarte im Jugendstil-Rahmen */
    .main-wrap {
      width: 100%;
      max-width: 650px;
    }

    .form-card {
      position: relative;
      background: var(--card);
      border: 2.5px solid var(--fflw-teal);
      border-radius: 32px 10px 32px 10px;
      padding: 66px 26px 36px;
      box-shadow:
        0 0 0 5px var(--fflw-teal-soft),
        0 0 0 7.5px var(--jugendstil-gold),
        0 14px 36px rgba(0, 77, 64, 0.15);
    }

    /* Jugendstil-Logo-Medaillon direkt in den oberen Rahmen integriert */
    .jugendstil-crest {
      position: absolute;
      top: -54px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .crest-wing {
      display: flex;
      align-items: center;
      color: var(--jugendstil-gold);
      font-size: 1.15rem;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #ffffff 0%, var(--fflw-teal-soft) 100%);
      padding: 4px 14px;
      border-top: 2px solid var(--jugendstil-gold);
      border-bottom: 2px solid var(--fflw-teal);
      box-shadow: 0 3px 10px rgba(0, 77, 64, 0.1);
      white-space: nowrap;
    }

    .crest-wing.left {
      border-left: 2px solid var(--jugendstil-gold);
      border-radius: 22px 0 0 8px;
      margin-right: -10px;
      padding-right: 18px;
    }

    .crest-wing.right {
      border-right: 2px solid var(--jugendstil-gold);
      border-radius: 0 22px 8px 0;
      margin-left: -10px;
      padding-left: 18px;
    }

    .crest-medallion {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 65%, var(--fflw-teal-soft) 100%);
      border: 3px solid var(--jugendstil-gold);
      box-shadow:
        0 0 0 4px #ffffff,
        0 0 0 6px var(--fflw-teal),
        0 8px 20px rgba(0, 77, 64, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 2;
    }

    .crest-medallion img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .org-banner {
      text-align: center;
      margin-bottom: 10px;
    }

    .org-name {
      font-family: Georgia, serif;
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--fflw-teal);
      letter-spacing: 0.03em;
    }

    .org-sub {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .floral-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 10px auto 18px;
      max-width: 360px;
    }
    .floral-divider span.line {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--fflw-teal), var(--jugendstil-gold), var(--fflw-teal), transparent);
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      margin: 4px 0 4px;
      font-size: 1.55rem;
      color: var(--fflw-teal-dark);
      text-align: center;
    }

    .intro {
      text-align: center;
      color: var(--muted);
      margin: 0 0 18px;
      font-size: 0.96rem;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--fflw-teal-dark);
      margin: 16px 0 6px;
    }

    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--fflw-teal-mid);
      border-radius: 14px 4px 14px 4px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, textarea:focus, input[type="file"]:focus {
      outline: none;
      border-color: var(--fflw-teal-dark);
      box-shadow: 0 0 0 3px rgba(38, 166, 154, 0.2);
    }

    textarea { min-height: 92px; resize: vertical; }

    .hint {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .duration-warn {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      background: #ffe8e8;
      border: 1.5px solid #e06c6c;
      border-radius: 12px;
      color: #8a1f1f;
      font-size: 0.94rem;
      font-weight: 500;
      line-height: 1.5;
    }

    /* Absende-Knopf mit unserem Logo & 3D-Raumdrehung */
    button#submitBtn {
      margin-top: 24px;
      width: 100%;
      padding: 13px 18px;
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--fflw-teal), var(--fflw-teal-dark));
      border: 2px solid var(--jugendstil-gold);
      border-radius: 18px 5px 18px 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 77, 64, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button#submitBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 77, 64, 0.28);
    }

    button#submitBtn:disabled {
      background: linear-gradient(135deg, #1b5e54, #0f3d36);
      cursor: wait;
    }

    .btn-logo-stage {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 50%;
      padding: 4px;
      border: 1.5px solid var(--jugendstil-gold);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      perspective: 500px;
      flex-shrink: 0;
    }

    .btn-logo-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-style: preserve-3d;
    }

    /* 3D-Drehung in den Raum hinein während des Hochladens */
    .spin-3d-space {
      animation: spinInSpace 2.2s infinite linear;
    }

    @keyframes spinInSpace {
      0%   { transform: perspective(400px) rotateY(0deg) scale(1); }
      25%  { transform: perspective(400px) rotateY(90deg) scale(1.12); }
      50%  { transform: perspective(400px) rotateY(180deg) scale(1); }
      75%  { transform: perspective(400px) rotateY(270deg) scale(0.92); }
      100% { transform: perspective(400px) rotateY(360deg) scale(1); }
    }

    /* Prozent-Fortschrittsbalken */
    .progress-bar-wrap {
      display: none;
      width: 100%;
      height: 14px;
      background: var(--fflw-teal-soft);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid var(--fflw-teal-mid);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--fflw-teal), var(--fflw-warm), var(--jugendstil-gold));
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    .status {
      margin-top: 16px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 500;
      line-height: 1.5;
    }
    .status.ok { display: block; background: var(--fflw-teal-soft); color: var(--fflw-teal-dark); border: 1.5px solid var(--fflw-teal); }
    .status.err { display: block; background: #ffe3e3; color: #8a1f1f; border: 1.5px solid #f8b4b4; }
    .status.wait { display: block; background: #fdf8ee; color: #7c5818; border: 1.5px solid var(--jugendstil-gold); }

    @media (max-width: 440px) {
      .crest-wing {
        font-size: 0.95rem;
        padding: 3px 10px;
      }
      .crest-medallion {
        width: 96px;
        height: 96px;
      }
      .form-card {
        padding: 58px 18px 30px;
      }
    }
  </style>
</head>
<body>

<div class="main-wrap">
  <div class="form-card">
    <!-- Jugendstil-Logo-Emblem im oberen Rahmen -->
    <div class="jugendstil-crest">
      <div class="crest-wing left">❧ ✿</div>
      <div class="crest-medallion">
        <img src="assets/logo-ffwl-neu-trans.png" alt="Freundeskreis Leutenbach-Winnenden">
      </div>
      <div class="crest-wing right">✿ ❧</div>
    </div>

    <div class="org-banner">
      <div class="org-name">Freundeskreis Leutenbach-Winnenden</div>
      <div class="org-sub">Gemeinsam helfen · Miteinander verbinden</div>
    </div>

    <h1>🎬 Videogruß für Birgid einreichen</h1>
    <div class="floral-divider">
      <span class="line"></span>
      <span style="color:#c8963e; font-size:1.15rem;">❦ ✿ ❦</span>
      <span class="line"></span>
    </div>
    <p class="intro">Bitte verrate es nicht weiter – wir sammeln persönliche Videogrüße und liebe Worte zum Abschied.</p>

    <form id="uploadForm">
      <label for="absender">Dein Name / Eure Familie *</label>
      <input type="text" id="absender" required placeholder="z. B. Familie Al-Mansoor oder Maria & Peter">

      <label for="videoDatei">Videogruß (oder Foto) auswählen *</label>
      <input type="file" id="videoDatei" accept="video/*,image/*" required>
      <div class="hint">Tipp: Handy bitte quer halten – <strong>maximal 2 Minuten</strong> aufnehmen.</div>
      <div id="durationWarn" class="duration-warn"></div>

      <label for="nachricht">Kurzer schriftlicher Gruß dazu (optional)</label>
      <textarea id="nachricht" placeholder="Danke für deine Hilfe und alles Gute bei deinen Kindern!"></textarea>

      <button type="submit" id="submitBtn">
        <span class="btn-logo-stage">
          <img id="btnLogo" src="assets/logo-ffwl-neu-trans.png" alt="">
        </span>
        <span id="btnText">Videogruß jetzt absenden</span>
      </button>

      <div id="progressWrap" class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
    </form>

    <div id="statusBox" class="status"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2PjaMEug9ZDqMS3Sd1YDf0ptCgr5ytt2EeWfmjrFqYKabVXfhHyI-v-wotjE9sTJycA/exec";
  const MAX_SEKUNDEN = 123;
  const MAX_MB = 250;

  let videoZuLang = false;

  document.getElementById("videoDatei").addEventListener("change", function() {
    const warnBox = document.getElementById("durationWarn");
    warnBox.style.display = "none";
    videoZuLang = false;

    const file = this.files[0];
    if (!file) return;

    const sizeMB = file.size / (1024 * 1024);
    if (sizeMB > MAX_MB) {
      videoZuLang = true;
      warnBox.style.display = "block";
      warnBox.innerHTML = "⚠️ <strong>Diese Datei ist leider zu groß (" + Math.round(sizeMB) + " MB).</strong> Bitte nimm das Video etwas kürzer auf (maximal 2 Minuten).";
      return;
    }

    if (file.type.startsWith("video/")) {
      const tempVideo = document.createElement("video");
      tempVideo.preload = "metadata";
      tempVideo.onloadedmetadata = function() {
        window.URL.revokeObjectURL(tempVideo.src);
        if (tempVideo.duration > MAX_SEKUNDEN) {
          videoZuLang = true;
          const min = Math.floor(tempVideo.duration / 60);
          const sec = Math.round(tempVideo.duration % 60);
          warnBox.style.display = "block";
          warnBox.innerHTML = "⚠️ <strong>Dein Video ist " + min + ":" + (sec < 10 ? "0" : "") + sec + " Minuten lang.</strong><br>Damit alle Grüße gut Platz haben, sind <strong>maximal 2 Minuten</strong> erlaubt. Bitte kürze das Video auf deinem Handy oder nimm es kurz neu auf!";
        }
      };
      tempVideo.src = URL.createObjectURL(file);
    }
  });

  document.getElementById("uploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const btnLogo = document.getElementById("btnLogo");
    const btnText = document.getElementById("btnText");
    const progressWrap = document.getElementById("progressWrap");
    const progressFill = document.getElementById("progressFill");
    const statusBox = document.getElementById("statusBox");
    const file = document.getElementById("videoDatei").files[0];

    if (!file) return;

    if (videoZuLang) {
      statusBox.className = "status err";
      statusBox.innerHTML = "Bitte kürze dein Video zuerst auf <strong>maximal 2 Minuten</strong> und wähle es dann neu aus.";
      return;
    }

    btn.disabled = true;
    btnLogo.classList.add("spin-3d-space");
    btnText.textContent = "Upload wird vorbereitet...";
    progressWrap.style.display = "block";
    progressFill.style.width = "5%";

    statusBox.className = "status wait";
    statusBox.innerHTML = "<strong>Dein Videogruß wird übertragen...</strong><br>Bitte diese Seite geöffnet lassen und das Handy kurz nicht sperren.";

    try {
      const initRes = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          absender: document.getElementById("absender").value,
          nachricht: document.getElementById("nachricht").value,
          fileName: file.name,
          mimeType: file.type
        })
      });
      const initData = await initRes.json();
      if (!initData.ok || !initData.uploadUrl) {
        throw new Error(initData.error || "Upload konnte nicht gestartet werden.");
      }

      await uploadDirectToDrive(initData.uploadUrl, file, function(percent) {
        progressFill.style.width = percent + "%";
        btnText.textContent = "Wird hochgeladen (" + percent + "%)...";
      });

      statusBox.className = "status ok";
      statusBox.innerHTML = "✅ <strong>Herzlichen Dank!</strong> Dein Videogruß ist vollständig angekommen und erscheint sofort auf der Überraschungsseite.";
      document.getElementById("uploadForm").reset();
      document.getElementById("durationWarn").style.display = "none";
    } catch (err) {
      statusBox.className = "status err";
      statusBox.textContent = "Fehler beim Hochladen: " + err.message;
    } finally {
      btn.disabled = false;
      btnLogo.classList.remove("spin-3d-space");
      btnText.textContent = "Videogruß jetzt absenden";
      progressWrap.style.display = "none";
    }
  });

  function uploadDirectToDrive(uploadUrl, file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl, true);
      xhr.setRequestHeader("Content-Type", file.type || "video/mp4");

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const pct = Math.max(5, Math.min(99, Math.round((e.loaded / e.total) * 100)));
          onProgress(pct);
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200 || xhr.status === 201) {
          onProgress(100);
          resolve();
        } else {
          reject(new Error("Google Drive Antwort: " + xhr.status));
        }
      };

      xhr.onerror = function() {
        reject(new Error("Netzwerkverbindung unterbrochen – bitte erneut versuchen."));
      };

      xhr.send(file);
    });
  }
</script>

</body>
</html>
